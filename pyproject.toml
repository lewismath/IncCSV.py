[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inccsv"
version = "0.1.0"
description = "Python implementation of the INC file format (INI metadata + CSV data)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7.0", "pandas>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
