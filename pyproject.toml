[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inccsv"
version = "0.1.0"
description = "Python implementation of the INC file format (INI metadata + CSV data)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "Lewis Mitchell", email = "lewis.mitchell@adelaide.edu.au" },
]
keywords = ["csv", "metadata", "inc", "data", "tabular"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: File Formats",
]

[project.urls]
Homepage = "https://github.com/lewismath/IncCSV.py"
Repository = "https://github.com/lewismath/IncCSV.py"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7.0", "pandas>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
